# Pilot deployment (SVX-TECH-001 sections 3.4, 11).
#
# One 2 GiB / 1 vCPU host runs everything: Caddy, Gunicorn, the job worker and
# PostgreSQL. This is a single infrastructure failure domain with no automatic
# failover, which is acceptable for an internal pilot with a tested restore —
# and must not be sold as an availability guarantee (ADR006, section 18.3).
#
# Memory is budgeted deliberately. An out-of-memory kill fails the pilot test
# (section 11.3), so each service has a hard limit and the total leaves
# headroom for the operating system.

name: scalevexo

services:
  db:
    # Pinned by digest (section 2.3). Tag shown for readability only;
    # infra/refresh-digests.sh updates both.  postgres:17-alpine @ 2026-09-29
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svx}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      # Deterministic collation: an index built under one locale and queried
      # under another can return wrong results after an image upgrade.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      # Conservative settings for a 2 GiB shared host (section 11.3).
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the unprivileged application and scheduler roles. Runs once, on
      # first initialisation of an empty data directory.
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-svx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  api:
    image: ${API_IMAGE:?pin by digest, e.g. ghcr.io/scalevexo/api@sha256:...}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      # One worker, two threads (section 3.4). More processes do not make a
      # one-vCPU server faster; they make it swap.
      - --workers=1
      - --threads=2
      - --timeout=60
      - --graceful-timeout=30
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - private-files:/app/private-files
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ${API_IMAGE:?pin by digest}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # A tick every 60 seconds. Overlapping ticks are safe: claiming uses
    # SELECT ... FOR UPDATE SKIP LOCKED, so a slow tick does not block the next.
    command:
      - sh
      - -c
      - |
        while true; do
          python manage.py run_scheduler_tick || echo "tick failed; continuing"
          sleep 60
        done
    volumes:
      - private-files:/app/private-files
    depends_on:
      db: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    # caddy:2-alpine @ 2026-09-29
    image: caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built in CI and copied here; never built on this host (section 11.3).
      - web-assets:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_started}
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  db-data:
  private-files:
  web-assets:
  caddy-data:
  caddy-config:
